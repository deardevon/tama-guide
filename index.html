<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aunt Devon's Tamagotchi Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: white header with a green title pill and three red tabs over a navy rule; green body; centered navy cards with a gold edge, the main card ending in a rising sun over water. */
:root{
  --page:#FFFFFF; --ink:#16163A; --green:#468A6F; --green-deep:#3A7660; --navy:#222255; --gold:#E8C449;
  --red:#B8211C; --red-soft:#EE7468; --sun:#D23B2B; --on-green:#FFFFFF; --on-green-muted:#D9EDE4;
  --title-pill:#468A6F; --title-shadow:#222255;
  /* card interior */
  --c-ink:#FFFFFF; --c-muted:#B9BAE4; --c-line:#3E3E7E; --c-surface:#2C2C68; --c-sunk:#1A1A46;
  --good:#74D6A2; --warn:#FFC35C; --bad:#FF8A80;
  --f-display:"Amatic SC", "Segoe Print", "Comic Sans MS", cursive;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#14142E; --ink:#F1EFFF; --green:#24513F; --green-deep:#1D4334; --red:#FF6B5E; --red-soft:#FFB0A8; --on-green-muted:#B9D6CA;
  --title-pill:#3E7D63; --title-shadow:#0B0B20; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#14142E; --ink:#F1EFFF; --green:#24513F; --green-deep:#1D4334; --red:#FF6B5E; --red-soft:#FFB0A8; --on-green-muted:#B9D6CA;
  --title-pill:#3E7D63; --title-shadow:#0B0B20; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--green);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.12em;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
header.top{background:var(--page)}
.title-wrap{padding-block:28px 18px;display:flex;justify-content:center}
.title{background:var(--title-pill);border:2.5px solid var(--navy);border-radius:32px;padding:10px 28px;color:#FFFFFF;font-size:clamp(1.7rem,6.2vw,2.6rem);letter-spacing:.14em;text-align:center;text-shadow:2px 2px 0 var(--title-shadow)}
nav.tabs{display:flex;justify-content:space-around;gap:8px;padding-block:4px 6px}
nav.tabs a{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,5.6vw,2.1rem);letter-spacing:clamp(.06em,1vw,.14em);color:var(--red);text-decoration:none;padding:2px 8px;border-radius:12px}
nav.tabs a[aria-current="page"]{color:var(--red-soft);-webkit-text-stroke:.7px var(--red)}
nav.tabs a:hover{background:color-mix(in srgb,var(--red) 8%,transparent)}
.rule{height:3px;background:var(--navy)}
.sync{display:block;text-align:center;font-size:.75rem;color:var(--on-green-muted);padding-top:10px}

main{padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}

/* players row (on green) */
.players{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;color:var(--on-green)}
.players .lbl{font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:.1em}
.pchip{border:2px solid var(--gold);background:transparent;color:var(--on-green);border-radius:999px;padding:3px 16px;font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.08em}
.pchip[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
.pchip.add{border-style:dashed}
.pedit{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}

/* cards */
.card{background:var(--navy);color:var(--c-ink);border:2.5px solid var(--gold);border-radius:30px;padding:28px 24px;
  --surface:var(--c-surface);--sunk:var(--c-sunk);--line:var(--c-line);--muted:var(--c-muted)}
@media (max-width:520px){.card{padding:22px 16px;border-radius:24px}}
.card.center{text-align:center}
.card h2{font-size:2.2rem}
.card h3{font-size:1.7rem}
.hand{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:1.35rem;line-height:1.35}
.muted{color:var(--muted)}
.sun{display:block;width:min(240px,70%);height:auto;margin:26px auto -6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* inputs */
.pill-select,.pill-input{background:var(--c-surface);color:var(--c-ink);border:0;border-radius:999px;padding:9px 20px;font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.08em;max-width:100%}
.pill-select{min-width:min(260px,100%);text-align:center;text-align-last:center}
.pill-select option,.pill-select optgroup{font-family:var(--f-body);font-size:1rem;letter-spacing:0;text-align:left;background:var(--navy);color:#FFFFFF}
.pill-input::placeholder{color:var(--c-muted)}
.btn{border:2px solid var(--gold);background:transparent;color:var(--c-ink);border-radius:999px;padding:5px 18px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.08em}
.btn.primary{background:var(--gold);color:var(--navy)}
.btn.small{font-size:1.1rem;padding:2px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* sprites */
.spr{width:var(--s,32px);height:var(--s,32px);object-fit:contain;image-rendering:pixelated;flex:none;display:inline-block;vertical-align:middle}
.spr.hero{--s:96px}
.spr.sil{filter:brightness(0) invert(1);opacity:.2}

/* my tama */
.slot{display:flex;flex-direction:column;align-items:center;gap:10px}
.slot+.slot{margin-top:26px}
.slot .ph{width:96px;height:96px;display:grid;place-items:center;border:2px dashed var(--c-line);border-radius:24px;font-family:var(--f-display);font-size:2.4rem;color:var(--c-muted)}
.steps{margin-top:30px;display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:520px;margin-inline:auto}
.step{text-align:left;border-radius:18px;background:var(--c-sunk)}
.step>summary{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:12px 14px;cursor:pointer;list-style:none;border-radius:18px}
.step>summary::-webkit-details-marker{display:none}
.step>summary:hover{background:color-mix(in srgb,var(--c-surface) 45%,transparent)}
.more-hint{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.08em;color:var(--gold)}
.more-hint i{font-style:normal;display:inline-block;transition:transform .2s}
.step[open] .more-hint i{transform:rotate(180deg)}
.more{margin:0 14px 14px;padding:12px 14px;border-radius:14px;background:var(--c-surface);display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--c-line)}
@media (prefers-reduced-motion:no-preference){.step[open] .more{animation:openup .22s ease-out}}
@keyframes openup{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .spr{--s:44px}
.mrow .arrow{color:var(--gold);font-weight:800}
.mrow small,.mfood small{color:var(--c-muted);font-size:.85rem}
.mfood{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--c-line)}
.mfood .spr{--s:44px}
.mfood b{font-family:var(--f-body);font-size:1rem;letter-spacing:0}
.mfood .where{display:block;font-size:.92rem;font-weight:700;color:var(--gold)}
.mfood .where .spr{--s:20px;margin:0 2px}
.mfood small{display:block;margin:0}
.mlist{margin:0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.madults{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:480px){.madults{grid-template-columns:repeat(2,minmax(0,1fr))}}
.madult{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--c-sunk);border:2px solid transparent;min-width:0}
.madult .spr{--s:44px}
.madult b{font-family:var(--f-body);font-size:.8rem;letter-spacing:0;line-height:1.2;overflow-wrap:anywhere}
.madult small{margin:0;font-size:.72rem}
.madult.isgoal{border-color:var(--gold)}
.step .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--c-surface);color:var(--c-muted);font-size:.95rem}
.step.done .ic{background:var(--good);color:var(--navy)}
.step.now{box-shadow:inset 0 0 0 2px var(--gold)} .step.now .ic{background:var(--gold);color:var(--navy)}
.step.no .ic{background:var(--bad);color:var(--navy)}
.step b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.08em;display:block;line-height:1.2}
.step p{margin:2px 0 0;font-size:.95rem;color:var(--c-ink)}
.step small{display:block;color:var(--c-muted);font-size:.85rem;margin-top:4px}
.step .foods{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.foodchip{display:inline-flex;align-items:center;gap:4px;background:var(--c-surface);border-radius:999px;padding:2px 10px 2px 4px;font-size:.85rem;font-weight:700}
.foodchip .spr{--s:22px}
.yay{margin-top:24px;font-family:var(--f-display);font-size:2rem;letter-spacing:.1em;color:var(--gold)}
.evolve{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.evo-lbl{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.08em;color:var(--gold)}
.evo-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px}
.evo{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:100px;max-width:130px;flex:1 1 100px;padding:8px 6px;border-radius:16px;border:2px solid var(--c-line);background:var(--c-surface);color:var(--c-ink);font:inherit}
.evo .spr{--s:44px}
.evo span{font-weight:800;font-size:.82rem;line-height:1.2}
.evo small{font-size:.7rem;color:var(--gold);font-weight:700}
.evo.onpath{border-color:var(--gold)}
.evo:hover{border-color:var(--gold)}
.suggest{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:10px}
.suggest .hand{margin:0;max-width:30ch}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;width:100%;max-width:560px}
.sg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:2px solid transparent;background:var(--c-surface);color:var(--c-ink);font:inherit}
.sg:hover{border-color:var(--gold)}
.sg .spr{--s:44px}
.sg span{font-size:.78rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.nextbox{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.nextbox small{font-size:.85rem}
.btn.big{font-size:1.6rem;padding:8px 26px}
.backup h3{text-align:center}
.backup .muted{text-align:center}
.codebox{width:100%;background:var(--c-sunk);color:var(--c-ink);border:2px solid var(--c-line);border-radius:14px;padding:10px 12px;font-family:var(--f-mono);font-size:.8rem;resize:vertical;margin-bottom:10px;word-break:break-all}
.confirm-box{background:var(--c-sunk);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;text-align:center;font-size:.92rem}
.bad-msg{color:var(--bad);text-align:center;margin:8px 0 0;font-size:.9rem}

/* collections */
.summary{display:flex;flex-direction:column;gap:6px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 6px;border:0;background:transparent;color:var(--c-ink);border-bottom:1px solid var(--c-line);text-align:left;width:100%}
.sumrow:last-child{border-bottom:0}
.sumrow span{font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:.1em}
.sumrow .bar{flex:0 1 160px;height:8px;border-radius:4px;background:var(--c-sunk);overflow:hidden}
.sumrow .bar i{display:block;height:100%;background:var(--gold)}
.sumrow b{font-family:var(--f-mono);font-size:.9rem;min-width:4.5em;text-align:right}
.subtabs{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;justify-content:center}
.subtabs button{border:0;background:transparent;color:var(--on-green);font-family:var(--f-display);font-weight:700;font-size:1.45rem;letter-spacing:.1em;padding:2px 6px;border-bottom:3px solid transparent}
.subtabs button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.search{background:var(--page);color:var(--ink);border:0;border-radius:999px;padding:6px 16px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.08em;flex:0 1 200px;min-width:0}
.group{margin-top:20px}
.group:first-child{margin-top:0}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ghead h3{font-size:1.6rem}
.ghead small{font-family:var(--f-mono);color:var(--c-muted)}
.sublabel{font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.1em;color:var(--c-muted);margin:12px 0 6px}
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pill{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 12px;border-radius:999px;background:var(--c-surface);cursor:pointer;min-width:0;border:2px solid transparent}
.pill input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.pill span{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.06em;line-height:1.15;overflow-wrap:anywhere}
.pill small{margin-left:auto;font-size:.72rem;color:var(--c-muted);white-space:nowrap}
.pill.on{border-color:var(--gold)}
.pill:not(.on) .spr{opacity:.55}
.planet{padding:14px 16px;border-radius:20px;background:var(--c-sunk);display:flex;flex-direction:column;gap:8px}
.planet+.planet{margin-top:10px}
.planet .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.planet label.vis{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.08em}
.planet input{width:20px;height:20px;accent-color:var(--gold)}
.planet .set{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
.planet .met{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.planet .met label{display:flex;gap:6px;align-items:center;cursor:pointer}
.planet.on{box-shadow:inset 0 0 0 2px var(--gold)}
.mission{display:flex;align-items:center;gap:10px}
.mission+.mission{margin-top:8px}
.mission .pill{flex:1}
.x{border:0;background:transparent;color:var(--c-muted);font-size:1.1rem;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--c-ink)}
.empty{color:var(--c-muted);margin:0}

/* guide */
.gcard h2{margin-bottom:6px}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.stage{background:var(--c-sunk);border-radius:20px;padding:14px 16px}
.stage .who{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.stage h3{font-size:1.6rem}
.stage ul{margin:4px 0 0;padding-left:18px;font-size:.92rem}
.fieldtabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.species{background:var(--c-sunk);border-radius:22px;padding:16px;margin-top:14px}
.species .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.species .hd h3{font-size:1.6rem}
.species .fav{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;background:var(--c-surface);padding:3px 12px 3px 6px;border-radius:999px}
.species .fav .spr{--s:20px}
.adults{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:560px){.adults{grid-template-columns:repeat(2,minmax(0,1fr))}}
.adult{background:var(--c-surface);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.adult .spr{--s:52px}
.adult b{font-size:.88rem;line-height:1.2;overflow-wrap:anywhere}
.adult small{font-size:.75rem;color:var(--c-muted);line-height:1.3}
button.adult{border:2px solid transparent;color:var(--c-ink);font:inherit;cursor:pointer;position:relative}
button.adult:hover{border-color:var(--c-line)}
button.adult.isgoal{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.goalbadge{position:absolute;top:6px;right:8px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;color:var(--gold)}
.tip{text-align:center;margin:4px 0 0;font-size:.9rem;color:var(--c-muted)}
.tip b{color:var(--gold)}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-family:var(--f-display);font-size:1.15rem;letter-spacing:.08em;color:var(--c-muted);font-weight:700;padding:6px 10px 6px 0;border-bottom:1px solid var(--c-line)}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--c-line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.nm{display:flex;align-items:center;gap:8px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.recipe{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--c-line);font-size:.92rem}
.recipe:last-child{border-bottom:0}
.recipe .arrow{color:var(--gold);font-weight:800}
.snack{display:grid;grid-template-columns:minmax(0,13rem) 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--c-line);align-items:center}
.snack:last-child{border-bottom:0}
@media (max-width:520px){.snack{grid-template-columns:1fr;gap:2px}}
.code{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--c-line)}
.code:last-child{border-bottom:0}
.code .digits{font-family:var(--f-mono);font-size:1.15rem;letter-spacing:.1em;color:var(--gold)}
.mission-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;background:var(--c-surface);cursor:pointer;border:2px solid transparent}
.mission-row+.mission-row{margin-top:8px}
.mission-row.on{border-color:var(--gold)}
.mission-row input{width:20px;height:20px;accent-color:var(--gold)}
.mnum{font-family:var(--f-mono);font-size:.8rem;color:var(--c-muted);min-width:1.6em;text-align:right}
.mtxt{display:flex;flex-direction:column;min-width:0}
.mtxt b{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.06em;line-height:1.15}
.mtxt small{font-size:.82rem;color:var(--c-muted)}
.mtxt .mauto{color:var(--gold);font-weight:700}
.mgoal{font-family:var(--f-mono);font-size:.85rem;color:var(--c-ink)}
@media (max-width:480px){.mission-row{grid-template-columns:auto minmax(0,1fr) auto}.mnum{display:none}}
.level{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--c-line)}
.level:last-child{border-bottom:0}
.lvn{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.5rem}
.level b{font-family:var(--f-display);font-size:1.4rem;letter-spacing:.06em}
.level p{margin:2px 0 0;font-size:.9rem;color:var(--c-muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#FFFFFF;border:2px solid var(--gold);padding:6px 18px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.08em;z-index:20}

const LS_KEY="adtt-state-v1";
const newPlayer=(name)=>({id:"p"+Date.now()+Math.floor(Math.random()*1000),name,current:"",goal:"",tamas:{},toys:{},deco:{},codes:{},planets:{},missions:{}});
function migrate(o){
  if(o&&o.v===3) return Object.assign({v:3,players:[],active:"",missions:[],customPlanets:[]},o);
  const p=newPlayer("Me");
  if(o){
    Object.keys(o.adults||{}).forEach(a=>{if(o.adults[a]) p.tamas["adult:"+a]=true;});
    p.toys=o.toys||{}; p.deco=o.deco||{}; p.codes=o.codes||{};
    Object.entries(o.planets||{}).forEach(([n,v])=>{p.planets[n]={visited:!!v.visited,met:v.met||{}};});
    (o.history||[]).forEach(h=>{if(h.adult) p.tamas["adult:"+h.adult]=true;});
    const t=o.tama; if(t){ p.goal=t.goal||""; p.current=t.stage==="baby"?"baby:Babymarutchi":t.stage==="kid"?"kid:"+t.field:t.stage==="young"?"young:"+t.species:t.adult?"adult:"+t.adult:""; }
  }
  return {v:3,players:[p],active:p.id,missions:[],customPlanets:(o&&o.customPlanets)||[]};
}
let state;
try{const raw=localStorage.getItem(LS_KEY); state=migrate(raw?JSON.parse(raw):null);}catch(e){state=migrate(null);}
if(!state.players.length){const p=newPlayer("Me");state.players.push(p);state.active=p.id;}
const P=()=>state.players.find(p=>p.id===state.active)||state.players[0];
let dbRef=null, saveTimer=null, saving=Promise.resolve();
function setSync(text){document.getElementById("sync").textContent=text;}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(state));
    saving=saving.then(()=>dbRef.set(body)).then(()=>setSync("Saved to your account")).catch(()=>setSync("Couldn't save online · kept on this device"));},700);
}
async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.collection("data/users/"+id).doc("tracker");
    const snap=await dbRef.get();
    if(snap.exists){ state=migrate(JSON.parse(JSON.stringify(snap.data()))); if(!state.players.length){const p=newPlayer("Me");state.players.push(p);state.active=p.id;} try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} if(snap.data().v!==3) save(); render(); }
    else save();
    setSync("Saved to your account");
  }catch(e){ dbRef=null; }
}

        <small>+${f.hunger} Hunger · +${f.pts} ${esc(gs.cell)} point${f.pts>1?"s":""}</small></div></div>`;}).join("")+
      `<ul class="mlist"><li>Feed these while your Tama is a Kid. The food with the most points picks the species.</li><li>Dishes give the most: +4 points and +6 Hunger.</li><li>Cooking unlocks at Planet Level 3.</li></ul>`;

    :g.idx===1?["A Golden Peach (get all 9 eggs in an Egg Hunt) takes away 1 care mistake.","Cheerful Popcorn stops your Tama getting sick after a care mistake for a while.",`With 0 mistakes, don't fill both meters 5 times, or you'll get ${esc(gs.adults[0])} instead.`]

/* ---------------- BACKUP CODE ---------------- */
// Lists are append-only: new items must go at the end so old codes still restore correctly.
const BK={t:()=>TAMA_LIST.map(t=>t.key),o:()=>TOY_LIST.filter(i=>i.store==="toys").map(i=>i.id),d:()=>DECO_LIST.filter(i=>i.store==="deco").map(i=>i.id),k:()=>ALL_CODES,m:()=>MISSIONS.map(m=>m.id)};
const toB64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const fromB64=s=>Uint8Array.from(atob(String(s).replace(/-/g,"+").replace(/_/g,"/")),ch=>ch.charCodeAt(0));
function packBits(list,obj){const u=new Uint8Array(Math.ceil(list.length/8));list.forEach((k,i)=>{if(obj&&obj[k])u[i>>3]|=1<<(i&7);});return toB64(u);}
function unpackBits(list,s){const u=s?fromB64(s):new Uint8Array(0),o={};list.forEach((k,i)=>{if(u[i>>3]&(1<<(i&7)))o[k]=true;});return o;}
function makeBackup(){
  const pls=allPlanets(), metList=pls.flatMap(x=>x.visitors.map(v=>x.name+"|"+v));
  const data={v:1,cp:state.customPlanets,p:state.players.map(x=>{const vis={},met={};pls.forEach(pl=>{const s=x.planets[pl.name];if(s&&s.visited)vis[pl.name]=1;(pl.visitors||[]).forEach(v=>{if(s&&s.met&&s.met[v])met[pl.name+"|"+v]=1;});});
    return {n:x.name,c:x.current,g:x.goal,t:packBits(BK.t(),x.tamas),o:packBits(BK.o(),x.toys),d:packBits(BK.d(),x.deco),k:packBits(BK.k(),x.codes),m:packBits(BK.m(),x.missions),pv:packBits(pls.map(q=>q.name),vis),pm:packBits(metList,met)};})};
  return "TAMA1-"+toB64(new TextEncoder().encode(JSON.stringify(data)));
}
function readBackup(code){
  const s=String(code||"").trim().replace(/\s+/g,"");
  if(!s.startsWith("TAMA1-")) throw new Error("That doesn't look like a backup code. It should start with TAMA1-");
  const data=JSON.parse(new TextDecoder().decode(fromB64(s.slice(6))));
  const cps=data.cp||[], pls=PLANETS.filter(q=>PLANET_UNLOCK[q[0]]).map(q=>({name:q[0],visitors:q[3].split(" or "),lvl:PLANET_UNLOCK[q[0]]})).sort((a,b)=>a.lvl-b.lvl).concat(cps.map(n=>({name:n,visitors:[]})));
  const metList=pls.flatMap(x=>x.visitors.map(v=>x.name+"|"+v));
  const players=data.p.map(x=>{const np=newPlayer(x.n||"Player");np.current=x.c||"";np.goal=x.g||"";np.tamas=unpackBits(BK.t(),x.t);np.toys=unpackBits(BK.o(),x.o);np.deco=unpackBits(BK.d(),x.d);np.codes=unpackBits(BK.k(),x.k);np.missions=unpackBits(BK.m(),x.m);
    const vis=unpackBits(pls.map(q=>q.name),x.pv), met=unpackBits(metList,x.pm);
    pls.forEach(pl=>{const m={};pl.visitors.forEach(v=>{if(met[pl.name+"|"+v])m[v]=true;});if(vis[pl.name]||Object.keys(m).length)np.planets[pl.name]={visited:!!vis[pl.name],met:m};});return np;});
  if(!players.length) throw new Error("That backup code has no players in it.");
  return {players,customPlanets:cps};
}
function backupCard(){
  const b=ui.backup;
  return `<section class="card backup"><h3>Backup</h3>
    <p class="muted" style="margin:4px 0 12px;font-size:.92rem">${dbRef?"Your ticks save to your account. A backup code lets you move them to another device or copy of this guide.":"Your ticks are saved on this device only. Make a backup code and text it to a grown-up, so nothing gets lost on a new phone or tablet."}</p>

  } else if(ui.guide==="snacks"){
    html+=`<h2>Snacks</h2><p class="muted" style="margin:0">Snacks make your Tama happy. Some do something extra.</p>`;
    SNACKS.forEach(g=>{html+=`<div class="species"><div class="hd"><h3>${esc(g.g)}</h3></div>${g.items.map(i=>`<div class="snack"><span class="nm">${img("snack:"+i[0])}${esc(i[0])}</span><span style="font-size:.92rem">${esc(i[1])}</span></div>`).join("")}</div>`;});
    html+=`<div class="species"><div class="hd"><h3>Shop code snacks</h3></div>${CODES[1].items.map(i=>`<div class="snack"><span class="nm">${img("code:Snacks|"+i[0])}${esc(i[0])}</span><span style="font-size:.92rem">${esc(i[2])} · code ${fmtCode(i[1])}</span></div>`).join("")}</div>`;
  } else if(ui.guide==="levels"){
    html+=`<h2>Planet Levels</h2><p class="muted" style="margin:0">Your planet levels up when you finish each goal. New things unlock at every level, up to Level 10. This is for the Tropics and Glacier versions.</p>
      ${LEVELS.map(([n,goal,un])=>`<div class="level"><span class="lvn">${n}</span><div><b>${esc(goal)}</b>${un?`<p>${esc(un)}</p>`:""}</div></div>`).join("")}`;
  } else {
    html+=`<h2>Shop Codes</h2><p class="muted" style="margin:0">Type these into the shop code screen on your Tamagotchi. Tick shop-code items in Collections once you have them.</p>`;
    CODES.forEach(g=>{html+=`<div class="species"><div class="hd"><h3>${esc(g.g)}</h3></div>${g.items.map(i=>`<div class="code"><span class="nm">${img("code:"+g.g+"|"+i[0])}${esc(i[0])}</span><span class="digits">${fmtCode(i[1])}</span></div>`).join("")}</div>`;});
  }
  return html+SUN+`</section>`;
}

/* ---------------- ACTIONS ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.tagName==="INPUT"||b.tagName==="SELECT") return;
  const a=b.dataset.act, p=P();
  switch(a){
    case "player": if(b.dataset.id===state.active){ui.editPlayer=!ui.editPlayer;ui.addPlayer=false;}else{state.active=b.dataset.id;ui.editPlayer=false;} ui.confirm=null; break;
    case "addplayer": ui.addPlayer=!ui.addPlayer; ui.editPlayer=false; render(); setTimeout(()=>$("#newPlayer")?.focus(),0); return;
    case "addplayerok": { const n=($("#newPlayer").value||"").trim(); if(!n){toast("Type a name first");return;} const np=newPlayer(n); state.players.push(np); state.active=np.id; ui.addPlayer=false; toast("Now playing: "+n); break; }
    case "renameok": { const n=($("#renamePlayer").value||"").trim(); if(n) p.name=n; ui.editPlayer=false; break; }
    case "delplayer": ui.confirm="delplayer"; render(); return;
    case "delplayerok": state.players=state.players.filter(x=>x.id!==p.id); state.active=state.players[0].id; ui.editPlayer=false; ui.confirm=null; break;
    case "cancel": ui.confirm=null; ui.addPlayer=false; ui.editPlayer=false; render(); return;
    case "col": ui.col=b.dataset.k; ui.q=""; render(); return;
    case "guide": ui.guide=b.dataset.k; render(); return;
    case "field": ui.field=b.dataset.k; render(); return;
    case "setgoal": { const g=b.dataset.a; if(p.goal===g){ toast(g+" is already your goal"); return; } p.goal=g; toast(`★ ${g} is ${state.players.length>1?p.name+"'s":"your"} goal!${route()==="tama"?"":" See My Tama for how."}`); break; }
    case "evolve": { const k=b.dataset.k, t=tamaByKey(k); p.current=k; const isNew=!p.tamas[k]; p.tamas[k]=true; ui.open={};
      toast(p.goal&&t.adult===p.goal?`★ Goal reached: ${t.name}!`:isNew?`${t.name} added to Collections`:`Now: ${t.name}`); break; }
    case "nexttama": p.current="baby:Babymarutchi"; p.tamas["baby:Babymarutchi"]=true; p.goal=""; ui.open={}; toast("New egg! Pick your next goal."); window.scrollTo(0,0); break;
    case "bkmake": ui.backup={code:makeBackup()}; render(); return;
    case "bkhide": ui.backup={}; render(); return;
    case "bkcopy": { const t=$("#bkOut"); const ok=()=>toast("Backup code copied");
      try{ navigator.clipboard.writeText(ui.backup.code).then(ok,()=>{t.select();toast("Code selected. Copy it from your menu.");}); }catch(err){ t.select(); toast("Code selected. Copy it from your menu."); } return; }
    case "bkshare": navigator.share({title:"Tama Guide backup",text:ui.backup.code}).catch(()=>{}); return;
    case "bkcheck": { const v=$("#bkIn").value; try{ ui.backup={preview:readBackup(v),input:v}; }catch(err){ ui.backup={input:v,err:err.message&&err.message.startsWith("That")?err.message:"That code didn't work. Check it was copied in full."}; } render(); return; }
    case "bkcancel": ui.backup={}; render(); return;
    case "bkrestore": { const r=ui.backup.preview; state.players=r.players; state.active=r.players[0].id; r.customPlanets.forEach(n=>{if(!state.customPlanets.includes(n))state.customPlanets.push(n);}); ui.backup={}; toast("Backup restored!"); break; }
    case "pladd": { const n=($("#newPlanet").value||"").trim(); if(!n) return; if(allPlanets().some(x=>x.name.toLowerCase()===n.toLowerCase())){toast("That planet is already on the list");return;} state.customPlanets.push(n); break; }
    case "plrem": ui.confirm="pl:"+b.dataset.pl; render(); return;
    case "plremok": state.customPlanets=state.customPlanets.filter(n=>n!==b.dataset.pl); state.players.forEach(x=>delete x.planets[b.dataset.pl]); ui.confirm=null; break;
    case "miadd": { const n=($("#newMission").value||"").trim(); if(!n) return; state.missions.push({id:"m"+Date.now(),name:n}); break; }
    case "mirem": ui.confirm="mi:"+b.dataset.id; render(); return;
    case "miremok": state.missions=state.missions.filter(m=>m.id!==b.dataset.id); state.players.forEach(x=>delete x.missions[b.dataset.id]); ui.confirm=null; break;
    case "copy": { const c=b.dataset.c; try{ navigator.clipboard.writeText(c).then(()=>toast("Copied "+fmtCode(c)),()=>toast(fmtCode(c))); }catch(err){ toast(fmtCode(c)); } return; }
    default: return;
  }
  save(); render();
});
document.addEventListener("change",e=>{
  const el=e.target, d=el.dataset||{}, p=P(); if(!d.ch) return;
  if(d.ch==="own"){ p[d.store][d.id]=el.checked; }
  else if(d.ch==="current"){ p.current=el.value; if(el.value&&!p.tamas[el.value]){ p.tamas[el.value]=true; toast(tamaByKey(el.value).name+" added to Collections"); } }
  else if(d.ch==="goal"){ p.goal=el.value; }
  else if(d.ch==="visit"){ (p.planets[d.pl]=p.planets[d.pl]||{visited:false,met:{}}).visited=el.checked; }
  else if(d.ch==="met"){ const s=(p.planets[d.pl]=p.planets[d.pl]||{visited:false,met:{}}); s.met=s.met||{}; s.met[d.n]=el.checked; }
  else return;
  save(); render();
});
document.addEventListener("input",e=>{
  if(e.target.id!=="q") return;
  ui.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#q"); if(q){q.focus(); try{q.setSelectionRange(pos,pos);}catch(err){}}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const map={newPlayer:"addplayerok",renamePlayer:"renameok",newPlanet:"pladd",newMission:"miadd"}; const act=map[e.target.id];
  if(act) document.querySelector(`[data-act="${act}"]`)?.click();
});

render();
initCloud();
</script>
</body>
</html>
